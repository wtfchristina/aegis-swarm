name: Formal Invariant & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-gnc-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run 4-Pillar Mathematical & Safety Invariant Suite
        run: npm test

      - name: Verify Production WebGL/WebGPU Bundle Build
        run: npm run build
